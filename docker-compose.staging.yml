      RECEIVER_BEARER_TOKEN: ${STAGING_OPERATIONAL_ALERT_BEARER_TOKEN:?set a staging-only operational alert bearer token}
      RECEIVER_STATE_DIR: /var/lib/operational-alert-receiver
      DEAD_MAN_TARGET_URL: ${STAGING_PUBLIC_APP_URL:?set STAGING_PUBLIC_APP_URL}/api/healthz
      DEAD_MAN_INTERVAL_SECONDS: "60"
      DEAD_MAN_TIMEOUT_MS: "5000"
      DEAD_MAN_FAILURE_THRESHOLD: "3"
    volumes:
      - staging_alert_receipts:/var/lib/operational-alert-receiver
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(async r=>{const b=await r.json();process.exit(r.ok&&b.ok===true&&b.buildSha===process.env.RECEIVER_BUILD_SHA?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *staging-logging

  web:
    image: ${STAGING_WEB_IMAGE:?set immutable web image repository@sha256:<64 hex digest>}
    pull_policy: always
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_PORT: "80"
      API_UPSTREAM: http://api:5000
      NGINX_SERVER_NAME: ${STAGING_NGINX_SERVER_NAME:?set STAGING_NGINX_SERVER_NAME}
    expose:
      - "80"
    logging: *staging-logging

volumes:
  staging_pgdata:
  staging_mailtls:
  staging_mailca:
  staging_alert_receipts:
