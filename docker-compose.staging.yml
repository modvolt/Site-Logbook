# Site Logbook — standalone hardened staging runtime for Coolify.
#
# This file is intentionally complete: DO NOT merge it with docker-compose.yml.
# It accepts only STAGING_* deployment inputs, publishes no host ports, and
# relies on Coolify's isolated per-resource network. Coolify must assign a
# domain only to the web service on container port 80.

name: ${STAGING_COMPOSE_PROJECT_NAME:-site-logbook-staging}

x-staging-logging: &staging-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Fail before any stateful service starts if a staging-only boundary is not
  # explicit. Values are checked without printing them.
  staging-preflight:
    build:
      context: .
      dockerfile: deploy/staging/preflight/Dockerfile
    image: site-logbook-staging-preflight:${STAGING_BUILD_SHA:?set the exact 40-character deployed commit SHA}
    restart: "no"
    environment:
      STAGING_ENVIRONMENT_ID: ${STAGING_ENVIRONMENT_ID:?set STAGING_ENVIRONMENT_ID}
      STAGING_COMPOSE_PROJECT_NAME: ${STAGING_COMPOSE_PROJECT_NAME:-site-logbook-staging}
      STAGING_PUBLIC_APP_URL: ${STAGING_PUBLIC_APP_URL:?set STAGING_PUBLIC_APP_URL}
      STAGING_NGINX_SERVER_NAME: ${STAGING_NGINX_SERVER_NAME:?set STAGING_NGINX_SERVER_NAME}
      STAGING_BUILD_SHA: ${STAGING_BUILD_SHA:?set the exact 40-character deployed commit SHA}
      STAGING_POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set a staging-only PostgreSQL password}
      STAGING_SESSION_SECRET: ${STAGING_SESSION_SECRET:?set a staging-only session secret}
      STAGING_S3_ENDPOINT: ${STAGING_S3_ENDPOINT:?set the staging S3 HTTPS endpoint}
      STAGING_S3_REGION: ${STAGING_S3_REGION:?set the staging S3 region}
      STAGING_S3_BUCKET: ${STAGING_S3_BUCKET:?set a staging-only S3 bucket}
      STAGING_S3_ACCESS_KEY_ID: ${STAGING_S3_ACCESS_KEY_ID:?set a staging-only S3 access key id}
      STAGING_S3_SECRET_ACCESS_KEY: ${STAGING_S3_SECRET_ACCESS_KEY:?set a staging-only S3 secret access key}
      STAGING_S3_FORCE_PATH_STYLE: ${STAGING_S3_FORCE_PATH_STYLE:?set true or false for the staging S3 provider}
      STAGING_SECRET_ENCRYPTION_KEYRING: ${STAGING_SECRET_ENCRYPTION_KEYRING:?set a staging-only application keyring}
      STAGING_SECRET_ENCRYPTION_ACTIVE_KEY_ID: ${STAGING_SECRET_ENCRYPTION_ACTIVE_KEY_ID:?set the active staging application key id}
      STAGING_BACKUP_ENCRYPTION_KEYRING: ${STAGING_BACKUP_ENCRYPTION_KEYRING:?set a separate staging backup keyring}
      STAGING_BACKUP_ENCRYPTION_ACTIVE_KEY_ID: ${STAGING_BACKUP_ENCRYPTION_ACTIVE_KEY_ID:?set the active staging backup key id}
    logging: *staging-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      staging-preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: site_logbook_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set a staging-only PostgreSQL password}
      POSTGRES_DB: site_logbook_staging
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_logbook_staging -d site_logbook_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *staging-logging

  mailpit:
    # v1.30.0 contains the May 2026 security fixes. Relay/forwarding variables
    # are deliberately absent and neither SMTP nor the UI has a host port.
    build:
      context: .
      dockerfile: deploy/staging/mailpit/Dockerfile
    image: site-logbook-staging-mailpit:${STAGING_BUILD_SHA:?set the exact 40-character deployed commit SHA}
    restart: unless-stopped
    depends_on:
      staging-preflight:
        condition: service_completed_successfully
    environment:
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_ALLOW_INTERNAL_HTTP_REQUESTS: "false"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_TLS_CERT: /certs/private/server.crt
      MP_SMTP_TLS_KEY: /certs/private/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - staging_mailtls:/certs/private
      - staging_mailca:/certs/trust
    expose:
      - "1025"
      - "8025"
    logging: *staging-logging

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      args:
        BUILD_SHA: ${STAGING_BUILD_SHA:?set the exact 40-character deployed commit SHA}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      PORT: "5000"
      BUILD_SHA: ${STAGING_BUILD_SHA:?set the exact 40-character deployed commit SHA}
      DATABASE_URL: postgres://site_logbook_staging:${STAGING_POSTGRES_PASSWORD:?set a staging-only PostgreSQL password}@postgres:5432/site_logbook_staging
      SESSION_SECRET: ${STAGING_SESSION_SECRET:?set a staging-only session secret}
      PUBLIC_APP_URL: ${STAGING_PUBLIC_APP_URL:?set STAGING_PUBLIC_APP_URL}
      S3_ENDPOINT: ${STAGING_S3_ENDPOINT:?set the staging S3 HTTPS endpoint}
      S3_REGION: ${STAGING_S3_REGION:?set the staging S3 region}
      S3_BUCKET: ${STAGING_S3_BUCKET:?set a staging-only S3 bucket}
      S3_ACCESS_KEY_ID: ${STAGING_S3_ACCESS_KEY_ID:?set a staging-only S3 access key id}
      S3_SECRET_ACCESS_KEY: ${STAGING_S3_SECRET_ACCESS_KEY:?set a staging-only S3 secret access key}
      S3_FORCE_PATH_STYLE: ${STAGING_S3_FORCE_PATH_STYLE:?set true or false for the staging S3 provider}
      S3_PRIVATE_PREFIX: private
      S3_PUBLIC_PREFIX: public
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: staging@site-logbook.invalid
      SECRET_ENCRYPTION_KEYRING: ${STAGING_SECRET_ENCRYPTION_KEYRING:?set a staging-only application keyring}
      SECRET_ENCRYPTION_ACTIVE_KEY_ID: ${STAGING_SECRET_ENCRYPTION_ACTIVE_KEY_ID:?set the active staging application key id}
      BACKUP_ENCRYPTION_KEYRING: ${STAGING_BACKUP_ENCRYPTION_KEYRING:?set a separate staging backup keyring}
      BACKUP_ENCRYPTION_ACTIVE_KEY_ID: ${STAGING_BACKUP_ENCRYPTION_ACTIVE_KEY_ID:?set the active staging backup key id}
      TOKEN_ENCRYPTION_KEY: ""
      NODE_EXTRA_CA_CERTS: /run/staging-mail-ca/ca.crt
      BACKUP_ENABLED: "true"
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_RETENTION: "7"
      MAX_REQUEST_BODY_MB: "50"
      OPENAI_API_KEY: ""
      OPENAI_DOCUMENT_EXTRACTION_ENABLED: "false"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      JOB_SIGNATURE_EXPIRY_DAYS: "7"
      PPE_SIGNATURE_EXPIRY_DAYS: "30"
      PPE_CONFIRM_EXPIRY_DAYS: "30"
      QUOTE_SHARE_EXPIRY_DAYS: "30"
      WORK_SESSION_REVIEW_HOURS: "12"
      OCR_CACHE_PATH: /tmp/tesseract-cache
    expose:
      - "5000"
    volumes:
      - staging_mailca:/run/staging-mail-ca:ro
    logging: *staging-logging

  web:
    build:
      context: .
      dockerfile: artifacts/stavba/Dockerfile
      args:
        BASE_PATH: /
        VITE_BUILD_SHA: ${STAGING_BUILD_SHA:?set the exact 40-character deployed commit SHA}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_PORT: "80"
      API_UPSTREAM: http://api:5000
      NGINX_SERVER_NAME: ${STAGING_NGINX_SERVER_NAME:?set STAGING_NGINX_SERVER_NAME}
    expose:
      - "80"
    logging: *staging-logging

volumes:
  staging_pgdata:
  staging_mailtls:
  staging_mailca:
