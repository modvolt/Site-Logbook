  mailpit:
    # v1.30.0 contains the May 2026 security fixes. Relay/forwarding variables
    # are deliberately absent and neither SMTP nor the UI has a host port.
    image: ${STAGING_MAILPIT_IMAGE:?set immutable Mailpit image repository@sha256:<64 hex digest>}
    pull_policy: always
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    depends_on:
      staging-preflight:
        condition: service_completed_successfully
    environment:
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_ALLOW_INTERNAL_HTTP_REQUESTS: "false"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_TLS_CERT: /certs/private/server.crt
      MP_SMTP_TLS_KEY: /certs/private/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - staging_mailtls:/certs/private
      - staging_mailca:/certs/trust
    expose:
      - "1025"
      - "8025"
    logging: *staging-logging

  api:
    image: ${STAGING_API_IMAGE:?set immutable API image repository@sha256:<64 hex digest>}
    pull_policy: always
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1g
    mem_reservation: 768m
