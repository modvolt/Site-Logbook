# Stavba — production runtime (PostgreSQL + API + Web).
#
# This manifest has no build path or mutable image fallback. Render it only with
# separately approved immutable images and canonical production evidence. On
# Coolify, point a "Docker Compose" resource at this file and supply the same
# variables through the environment UI. See DEPLOYMENT.md.

services:
  postgres:
    image: ${PRODUCTION_POSTGRES_IMAGE:?set immutable PostgreSQL repository@sha256 digest}
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${PRODUCTION_API_IMAGE:?set immutable API repository@sha256 digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      SITE_LOGBOOK_RUNTIME_ENVIRONMENT: production
      BUILD_SHA: ${BUILD_SHA:?set the exact 40-character release commit SHA}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      # Object storage. Uploads are proxied through the API, which reaches the
      # bucket over S3_ENDPOINT — the browser never talks to storage, so no
      # browser-reachable endpoint or bucket CORS is required.
      #
      # Production storage is the externally managed Hetzner Object Storage
      # bucket. MinIO is not a production fallback and is intentionally absent
      # from this Compose file. Create the bucket and credentials in Hetzner:
      #   S3_ENDPOINT=https://fsn1.your-objectstorage.com
      #   S3_REGION=fsn1
      # The exact pre-migration backup additionally requires HTTPS, an official
      # Hetzner endpoint and durable object VersionId evidence.
      S3_ENDPOINT: ${S3_ENDPOINT:?set the canonical Hetzner Object Storage HTTPS endpoint}
      S3_REGION: ${S3_REGION:?set the Hetzner Object Storage location}
      S3_BUCKET: ${S3_BUCKET:?set the existing Hetzner bucket}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set the Hetzner S3 access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set the Hetzner S3 secret key}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # SMTP (optional — email features are disabled until configured).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Canonical origin for every externally shared bearer link. The API
      # refuses to derive links from request Host / X-Forwarded-Host headers.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      # Exact comma-separated nginx/edge IPs or bounded CIDRs. Production API
      # startup fails closed when this is absent; do not use hop counts or broad
      # private aliases. Record the real Coolify network topology first.
      API_TRUSTED_PROXY_CIDRS: ${API_TRUSTED_PROXY_CIDRS:-}
      EXTERNAL_ACCOUNTS_ENABLED: "false"
      # Production startup is schema-read-only. Supply the four canonical,
      # secret-free artifacts and independently recorded SHA-256 values only
      # after the one-shot 0107 control plane and offline v5 approval pass.
      PRODUCTION_EXPECTED_SOURCE_SHA: ${BUILD_SHA:?set exact release source SHA}
      PRODUCTION_EXPECTED_API_IMAGE: ${PRODUCTION_API_IMAGE:?set immutable API repository@sha256 digest}
      PRODUCTION_EXPECTED_DATABASE_NAME: ${POSTGRES_DB:?set exact production database name}
      PRODUCTION_EXPECTED_DATABASE_USER: ${POSTGRES_USER:?set exact production database user}
      PRODUCTION_EXPECTED_TARGET_SHA256: ${PRODUCTION_EXPECTED_TARGET_SHA256:?set approved canonical target evidence digest}
      PRODUCTION_EXPECTED_AUDIT_SCHEMA_FINGERPRINT_SHA256: ${PRODUCTION_EXPECTED_AUDIT_SCHEMA_FINGERPRINT_SHA256:?set approved live audit schema fingerprint}
      PRODUCTION_EXPECTED_PRE_MIGRATION_BACKUP_EVIDENCE_SHA256: ${PRODUCTION_EXPECTED_PRE_MIGRATION_BACKUP_EVIDENCE_SHA256:?set approved pre-migration backup evidence digest}
      PRODUCTION_EXPECTED_BACKUP_INTEGRITY_SHA256: ${PRODUCTION_EXPECTED_BACKUP_INTEGRITY_SHA256:?set approved backup table-count and row-binding integrity digest}
      PRODUCTION_EXPECTED_0096_0107_TRANSITION_CHAIN_SHA256: ${PRODUCTION_EXPECTED_0096_0107_TRANSITION_CHAIN_SHA256:?set approved complete 0096 through 0107 transition-chain digest}
      PRODUCTION_EXPECTED_ACTIVATION_APPROVAL_SHA256: ${PRODUCTION_EXPECTED_ACTIVATION_APPROVAL_SHA256:?set separate production activation approval digest}
      PRODUCTION_ACTIVATION_APPROVAL_EVIDENCE_B64: ${PRODUCTION_ACTIVATION_APPROVAL_EVIDENCE_B64:?set canonical activation approval artifact as base64}
      PRODUCTION_ACTIVATION_APPROVAL_EVIDENCE_SHA256: ${PRODUCTION_ACTIVATION_APPROVAL_EVIDENCE_SHA256:?set activation approval artifact sha256}
      PRODUCTION_AUDIT_0107_TARGET_EVIDENCE_B64: ${PRODUCTION_AUDIT_0107_TARGET_EVIDENCE_B64:?set canonical production target evidence as base64}
      PRODUCTION_AUDIT_0107_TARGET_EVIDENCE_SHA256: ${PRODUCTION_AUDIT_0107_TARGET_EVIDENCE_SHA256:?set target evidence sha256}
      PRODUCTION_AUDIT_0107_INTENT_EVIDENCE_B64: ${PRODUCTION_AUDIT_0107_INTENT_EVIDENCE_B64:?set canonical production intent evidence as base64}
      PRODUCTION_AUDIT_0107_INTENT_EVIDENCE_SHA256: ${PRODUCTION_AUDIT_0107_INTENT_EVIDENCE_SHA256:?set intent evidence sha256}
      PRODUCTION_AUDIT_0107_EXECUTION_EVIDENCE_B64: ${PRODUCTION_AUDIT_0107_EXECUTION_EVIDENCE_B64:?set canonical production execution evidence as base64}
      PRODUCTION_AUDIT_0107_EXECUTION_EVIDENCE_SHA256: ${PRODUCTION_AUDIT_0107_EXECUTION_EVIDENCE_SHA256:?set execution evidence sha256}
      PRODUCTION_AUDIT_0107_STEADY_EVIDENCE_B64: ${PRODUCTION_AUDIT_0107_STEADY_EVIDENCE_B64:?set canonical production steady evidence as base64}
      PRODUCTION_AUDIT_0107_STEADY_EVIDENCE_SHA256: ${PRODUCTION_AUDIT_0107_STEADY_EVIDENCE_SHA256:?set steady evidence sha256}
      PRODUCTION_AUDIT_0107_RELEASE_EVIDENCE_B64: ${PRODUCTION_AUDIT_0107_RELEASE_EVIDENCE_B64:?set canonical production release evidence as base64}
      PRODUCTION_AUDIT_0107_RELEASE_EVIDENCE_SHA256: ${PRODUCTION_AUDIT_0107_RELEASE_EVIDENCE_SHA256:?set release evidence sha256}
      PRODUCTION_HOST_ATTESTATION_B64: ${PRODUCTION_HOST_ATTESTATION_B64:?set reviewed detached host attestation as base64}
      PRODUCTION_HOST_ATTESTATION_SIGNATURE_B64: ${PRODUCTION_HOST_ATTESTATION_SIGNATURE_B64:?set detached host attestation signature as base64}

  web:
    image: ${PRODUCTION_WEB_IMAGE:?set immutable web repository@sha256 digest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGINX_PORT: 80
      API_UPSTREAM: http://api:5000
      # Space-separated nginx server_name values. Unknown external Host values
      # are handled by the default server and closed with status 444.
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    ports:
      - "${WEB_PORT:-18080}:80"

volumes:
  pgdata:
