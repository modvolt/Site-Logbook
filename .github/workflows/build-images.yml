name: Build images

on:
  pull_request:
    paths:
      - .github/workflows/build-images.yml
      - artifacts/api-server/**
      - artifacts/stavba/**
      - lib/**
      - scripts/start-api-production.sh
      - scripts/check-audit-0107-release-evidence.mjs
      - attached_assets/**
      - .npmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - tsconfig.json
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-images-pr-{0}', github.event.pull_request.number) || format('build-images-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Define image matrix
        id: matrix
        shell: bash
        run: |
          echo 'matrix={"include":[{"id":"production-api","repository":"ghcr.io/modvolt/site-logbook-production-api","context":".","dockerfile":"artifacts/api-server/Dockerfile","target":"production","platform":"linux/amd64","revisionArg":"BUILD_SHA","extraBuildArgs":"","profileKey":"io.modvolt.site-logbook.image-profile","profileValue":"production"},{"id":"production-control-plane","repository":"ghcr.io/modvolt/site-logbook-control-plane","context":".","dockerfile":"artifacts/api-server/Dockerfile","target":"control-plane","platform":"linux/amd64","revisionArg":"BUILD_SHA","extraBuildArgs":"","profileKey":"io.modvolt.site-logbook.image-profile","profileValue":"control-plane"},{"id":"production-host-operator","repository":"ghcr.io/modvolt/site-logbook-host-operator","context":".","dockerfile":"artifacts/api-server/Dockerfile","target":"host-operator","platform":"linux/amd64","revisionArg":"BUILD_SHA","extraBuildArgs":"","profileKey":"io.modvolt.site-logbook.image-profile","profileValue":"host-operator"},{"id":"production-web","repository":"ghcr.io/modvolt/site-logbook-production-web","context":".","dockerfile":"artifacts/stavba/Dockerfile","target":"runtime","platform":"linux/amd64","revisionArg":"VITE_BUILD_SHA","extraBuildArgs":"BASE_PATH=/","profileKey":"","profileValue":""}]}' >> "$GITHUB_OUTPUT"

  validate-images:
    if: github.event_name == 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Validate ${{ matrix.id }} without registry write
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            ${{ matrix.revisionArg }}=${{ github.event.pull_request.head.sha }}
            ${{ matrix.extraBuildArgs }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=build-images-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=build-images-${{ matrix.id }}

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure pinned Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.id }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ matrix.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/modvolt/Site-Logbook
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ${{ matrix.revisionArg }}=${{ github.sha }}
            ${{ matrix.extraBuildArgs }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=build-images-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=build-images-${{ matrix.id }}

      - name: Verify published digest and metadata
        id: verify
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
          PROFILE_KEY: ${{ matrix.profileKey }}
          PROFILE_VALUE: ${{ matrix.profileValue }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build action returned an invalid digest for ${IMAGE_ID}." >&2
            exit 1
          fi

          manifest_json="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
          resolved_digest="$(jq -r '.digest // empty' <<<"$manifest_json")"
          if [[ "$resolved_digest" != "$BUILD_DIGEST" ]]; then
            echo "Registry digest does not match the build output for ${IMAGE_ID}." >&2
            exit 1
          fi

          platform_os="${IMAGE_PLATFORM%%/*}"
          platform_arch="${IMAGE_PLATFORM##*/}"
          runnable_digest="$(
            jq -r --arg os "$platform_os" --arg arch "$platform_arch" \
              '[.manifests[]? | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest" and .platform.os == $os and .platform.architecture == $arch)][0].digest // empty' \
              <<<"$manifest_json"
          )"
          if [[ ! "$runnable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Expected platform is missing from the published manifest for ${IMAGE_ID}." >&2
            exit 1
          fi

          image_json="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${runnable_digest}" --format '{{json .Image}}')"
          jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg source "https://github.com/modvolt/Site-Logbook" \
            --arg profileKey "$PROFILE_KEY" \
            --arg profileValue "$PROFILE_VALUE" \
            '.config.Labels["org.opencontainers.image.source"] == $source and
             .config.Labels["org.opencontainers.image.revision"] == $sha and
             (if $profileKey == "" then
                (.config.Labels["io.modvolt.site-logbook.image-profile"] // null) == null
              else
                .config.Labels[$profileKey] == $profileValue
              end)' \
            <<<"$image_json" >/dev/null

          provenance_json="$(docker buildx imagetools inspect "$tag" --format '{{json .Provenance}}')"
          sbom_json="$(docker buildx imagetools inspect "$tag" --format '{{json .SBOM}}')"
          jq -e 'type == "object" and length > 0' <<<"$provenance_json" >/dev/null
          jq -e 'type == "object" and length > 0' <<<"$sbom_json" >/dev/null

          echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Write image summary
        shell: bash
        env:
          DIGEST: ${{ steps.verify.outputs.digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ matrix.profileValue }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          profile="${PROFILE:-explicitly absent}"
          {
            echo "### ${IMAGE_ID}"
            echo
            echo "- Repository: \`${IMAGE_REPOSITORY}\`"
            echo "- Full-SHA tag: \`${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Dockerfile: \`${DOCKERFILE}\`"
            echo "- Target: \`${TARGET}\`"
            echo "- Platform: \`${PLATFORM}\`"
            echo "- Profile: \`${profile}\`"
            echo "- Provenance enabled: \`true\`"
            echo "- SBOM enabled: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"
