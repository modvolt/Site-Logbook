name: Staging smoke (manual, no deploy)

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_target:
        description: Confirm that the configured GitHub staging environment cannot reach production targets
        required: true
        type: boolean
      confirm_deep_storage_probe:
        description: Allow the admin health endpoint to create and delete its diagnostic object in staging
        required: true
        type: boolean
      confirm_operational_alert_drill:
        description: Allow one redacted synthetic receiver event and duplicate acknowledgement in isolated staging
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  authenticated-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CI: "true"
      NODE_ENV: test
      STAGING_RELEASE_CONFIRM_ISOLATED: ${{ inputs.confirm_isolated_target }}
      STAGING_DEEP_STORAGE_PROBE_CONFIRMED: ${{ inputs.confirm_deep_storage_probe }}
      STAGING_ALERT_DRILL_CONFIRM_ISOLATED: ${{ inputs.confirm_operational_alert_drill }}
      STAGING_ALERT_DRILL_SOURCE_SHA: ${{ github.sha }}
      STAGING_ALERT_DRILL_RUN_ID: staging-${{ github.run_id }}-${{ github.run_attempt }}
      STAGING_ALERT_APP_HEALTH_URL: ${{ vars.STAGING_BASE_URL }}/api/healthz
      STAGING_ALERT_RECEIVER_URL: ${{ vars.STAGING_ALERT_RECEIVER_URL }}
      STAGING_ALERT_RECEIVER_BEARER_TOKEN: ${{ secrets.STAGING_ALERT_RECEIVER_BEARER_TOKEN }}
      STAGING_MAIL_SANDBOX_CONFIRMED: ${{ vars.STAGING_MAIL_SANDBOX_CONFIRMED }}
      STAGING_EXTERNAL_ACCOUNTS_ENABLED: ${{ vars.STAGING_EXTERNAL_ACCOUNTS_ENABLED }}
      STAGING_ENVIRONMENT_ID: ${{ vars.STAGING_ENVIRONMENT_ID }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_EXPECTED_BUILD_SHA: ${{ github.sha }}
      STAGING_GITHUB_RUN_ID: ${{ github.run_id }}
      STAGING_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      STAGING_IMAGE_MANIFEST_SHA256: ${{ vars.STAGING_IMAGE_MANIFEST_SHA256 }}
      STAGING_PROVISIONING_MANIFEST_SHA256: ${{ vars.STAGING_PROVISIONING_MANIFEST_SHA256 }}
      STAGING_DEPLOYMENT_INPUTS_SHA256: ${{ vars.STAGING_DEPLOYMENT_INPUTS_SHA256 }}
      STAGING_ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - name: Require all manual safety confirmations
        shell: bash
        run: |
          if [[ "$STAGING_RELEASE_CONFIRM_ISOLATED" != "true" || "$STAGING_DEEP_STORAGE_PROBE_CONFIRMED" != "true" || "$STAGING_ALERT_DRILL_CONFIRM_ISOLATED" != "true" ]]; then
            echo "Isolated-target, deep-storage-probe and operational-alert confirmations are required."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate staging contract without printing secrets
        run: pnpm gate:staging-config
      - name: Test staging guard and evidence contract
        run: pnpm test:staging-contract
      - name: Type-check the isolated staging suite
        run: pnpm typecheck:e2e:staging
      - name: Install the pinned Playwright Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run authenticated API, desktop, mobile, and PWA smoke
        run: pnpm test:e2e:staging
      - name: Prove exact-SHA alert receiver acceptance and persistent deduplication
        run: pnpm drill:staging-operational-alert
        env:
          STAGING_ALERT_DRILL_EVIDENCE_FILE: ${{ runner.temp }}/staging-operational-alert-evidence.json
      - name: Bind bootstrap evidence to its exact raw bytes
        shell: bash
        run: sha256sum e2e/test-results/staging-bootstrap-summary.json > e2e/test-results/staging-bootstrap-summary.sha256
      - name: Upload secret-free bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-bootstrap-${{ github.run_id }}
          path: |
            e2e/test-results/staging-bootstrap-summary.json
            e2e/test-results/staging-bootstrap-summary.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload secret-free operational alert drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-operational-alert-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-operational-alert-evidence.json
          if-no-files-found: ignore
          retention-days: 14
