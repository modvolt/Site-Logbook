name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hermetic-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_PATH: /
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: site_logbook_ci_test
          POSTGRES_PASSWORD: site-logbook-ci-only
          POSTGRES_USER: site_logbook_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U site_logbook_ci -d site_logbook_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate:quality
      - run: pnpm gate:release
      - name: Isolated API database suites
        run: pnpm --filter @workspace/api-server test:db
        env:
          TEST_DATABASE_URL: postgresql://site_logbook_ci:site-logbook-ci-only@127.0.0.1:5432/site_logbook_ci_test
