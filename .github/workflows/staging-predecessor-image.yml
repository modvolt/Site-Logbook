name: Publish immutable staging predecessor API (private caller, no deploy)

on:
  workflow_call:
    inputs:
      confirm_predecessor_registry_publication:
        description: Publish or verify only the fixed exact-0104 predecessor API image without deploying it
        required: true
        type: boolean
      verify_existing_only:
        description: Require the exact predecessor tag to exist and structurally disable every build or push step
        required: true
        type: boolean
    secrets:
      packages_metadata_token:
        description: Dedicated classic PAT with exactly read:packages for private Packages REST metadata
        required: true

permissions: {}

concurrency:
  group: site-logbook-images-publication
  cancel-in-progress: false

jobs:
  validate-fixed-public-source:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the fixed audited predecessor commit and tree
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          EXPECTED_SOURCE_TREE: cd46c3bcf51d6ab64f2fe788e0a7af97e74c999c
          PUBLICATION_CONFIRMED: ${{ inputs.confirm_predecessor_registry_publication }}
          SOURCE_REPOSITORY: modvolt/Site-Logbook
          VERIFY_EXISTING_ONLY: ${{ inputs.verify_existing_only }}
        run: |
          set -euo pipefail

          fail() {
            echo "Fixed predecessor source validation failed: $1" >&2
            exit 1
          }

          [[ "$PUBLICATION_CONFIRMED" == "true" ]] \
            || fail "the exact predecessor registry publication confirmation is required."
          [[ "$VERIFY_EXISTING_ONLY" == "true" || "$VERIFY_EXISTING_ONLY" == "false" ]] \
            || fail "verify_existing_only must be an explicit boolean."
          [[ "$EXPECTED_SOURCE_SHA" == "c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3" ]] \
            || fail "the fixed predecessor SHA drifted."
          [[ "$EXPECTED_SOURCE_TREE" == "cd46c3bcf51d6ab64f2fe788e0a7af97e74c999c" ]] \
            || fail "the fixed predecessor tree drifted."

          commit_json="$(
            curl --disable \
              --fail-with-body --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 30 \
              --header 'Accept: application/vnd.github+json' \
              --header 'User-Agent: site-logbook-private-predecessor-publisher' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/commits/${EXPECTED_SOURCE_SHA}"
          )" || fail "the fixed public predecessor commit could not be read."
          jq -e \
            --arg sha "$EXPECTED_SOURCE_SHA" \
            --arg tree "$EXPECTED_SOURCE_TREE" \
            '.sha == $sha and .commit.tree.sha == $tree' \
            <<<"$commit_json" >/dev/null \
            || fail "the public predecessor commit or tree is not exact."

  publish-fixed-predecessor-api:
    needs: validate-fixed-public-source
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE_SHA: c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
      EXPECTED_SOURCE_TREE: cd46c3bcf51d6ab64f2fe788e0a7af97e74c999c
      PACKAGE_NAME: site-logbook-staging-api
      REGISTRY_REPOSITORY: ghcr.io/modvolt/site-logbook-staging-api
    steps:
      - name: Require dedicated read-only Packages metadata credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
          REGISTRY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          fail() {
            echo "Fixed predecessor Packages metadata credential validation failed: $1" >&2
            exit 1
          }

          [[ -n "$GH_TOKEN" ]] \
            || fail "the named Packages metadata credential is required."
          [[ -n "$REGISTRY_GITHUB_TOKEN" ]] \
            || fail "the caller GITHUB_TOKEN is required for registry publication."
          [[ "$GH_TOKEN" != "$REGISTRY_GITHUB_TOKEN" ]] \
            || fail "the Packages metadata credential must be distinct from GITHUB_TOKEN."

          umask 077
          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          gh api --include \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            /user >"$response_file" \
            || fail "the Packages metadata credential identity could not be read."

          oauth_scopes="$(
            awk 'BEGIN { IGNORECASE=1 }
              /^x-oauth-scopes:/ {
                sub(/^[^:]*:[[:space:]]*/, "")
                gsub(/\r/, "")
                print
                exit
              }' "$response_file"
          )"
          normalized_scopes="$(
            tr ',' '\n' <<<"$oauth_scopes" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              sed '/^$/d' |
              LC_ALL=C sort -u |
              paste -sd, -
          )"
          [[ "$normalized_scopes" == "read:packages" ]] \
            || fail "the Packages metadata credential must have exactly the read:packages scope."

          identity_json="$(sed -n '/^[[:space:]]*{/,$p' "$response_file")"
          jq -e \
            '.login == "modvolt" and
             .id == 289280891 and
             .type == "User"' \
            <<<"$identity_json" >/dev/null \
            || fail "the Packages metadata credential must belong to the exact modvolt user."

      - name: Require approved private manual caller and exact tag state
        id: package-state
        shell: bash
        env:
          APPROVED_CALLER_REPOSITORY: modvolt/site-logbook-registry
          APPROVED_CALLER_WORKFLOW_REF: modvolt/site-logbook-registry/.github/workflows/publish-staging-predecessor.yml@refs/heads/main
          CALLER_ACTOR: ${{ github.actor }}
          CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
          PUBLICATION_CONFIRMED: ${{ inputs.confirm_predecessor_registry_publication }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          VERIFY_EXISTING_ONLY: ${{ inputs.verify_existing_only }}
        run: |
          set -euo pipefail

          fail() {
            echo "Fixed predecessor package preflight failed: $1" >&2
            exit 1
          }

          [[ "$PUBLICATION_CONFIRMED" == "true" ]] \
            || fail "registry publication confirmation is required."
          [[ "$VERIFY_EXISTING_ONLY" == "true" || "$VERIFY_EXISTING_ONLY" == "false" ]] \
            || fail "verify_existing_only must be an explicit boolean."
          [[ "${CALLER_REPOSITORY,,}" == "$APPROVED_CALLER_REPOSITORY" ]] \
            || fail "the reusable workflow must be called by the approved private repository."
          [[ "${CALLER_REPOSITORY_OWNER,,}" == "modvolt" ]] \
            || fail "the private caller owner is not approved."
          [[ "${CALLER_ACTOR,,}" == "modvolt" && "${TRIGGERING_ACTOR,,}" == "modvolt" ]] \
            || fail "the manual private publication must be initiated by the approved owner."
          [[ "${CALLER_WORKFLOW_REF,,}" == "$APPROVED_CALLER_WORKFLOW_REF" ]] \
            || fail "the private predecessor wrapper must run from its exact main-branch path."

          caller_json="$(GH_TOKEN="$CALLER_GITHUB_TOKEN" gh api --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${CALLER_REPOSITORY}")" \
            || fail "the private caller repository could not be read."
          jq -e \
            --arg caller "$APPROVED_CALLER_REPOSITORY" \
            '(.full_name | ascii_downcase) == $caller and
             (.owner.login | ascii_downcase) == "modvolt" and
             .private == true' \
            <<<"$caller_json" >/dev/null \
            || fail "the caller repository must remain private and owned by modvolt."

          inventory_json="$(
            gh api --paginate \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              '/user/packages?package_type=container&visibility=private&per_page=100' |
              jq -s 'add'
          )" || fail "the authenticated private package inventory could not be read."
          jq -e 'type == "array"' <<<"$inventory_json" >/dev/null \
            || fail "the authenticated package inventory is malformed."
          matching_packages_json="$(
            jq -c --arg name "$PACKAGE_NAME" \
              '[.[] | select((.name | ascii_downcase) == $name)]' \
              <<<"$inventory_json"
          )"
          jq -e \
            '([.[].id] | length) == ([.[].id] | unique | length)' \
            <<<"$matching_packages_json" >/dev/null \
            || fail "duplicate package identifiers exist for the staging API package."
          package_count="$(jq -r 'length' <<<"$matching_packages_json")"
          [[ "$package_count" == "0" || "$package_count" == "1" ]] \
            || fail "duplicate package metadata exists for the staging API package."

          existing_digest=""
          publish="true"
          initial_tag_state="absent"
          if [[ "$package_count" == "1" ]]; then
            package_json="$(
              gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}"
            )" || fail "the staging API package metadata could not be read."
            jq -e \
              --arg caller "$APPROVED_CALLER_REPOSITORY" \
              --arg package "$PACKAGE_NAME" \
              '(.id | type) == "number" and .id > 0 and
               .name == $package and
               .package_type == "container" and
               (.owner.login | ascii_downcase) == "modvolt" and
               .visibility == "private" and
               (.repository.full_name | ascii_downcase) == $caller and
               .repository.private == true and
               (.version_count | type) == "number" and .version_count >= 0' \
              <<<"$package_json" >/dev/null \
              || fail "the staging API package is not private and caller-linked."
            versions_json="$(
              gh api --paginate \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}/versions?state=active&per_page=100" |
                jq -s 'add'
            )" || fail "the staging API package versions could not be read."
            jq -e 'type == "array"' <<<"$versions_json" >/dev/null \
              || fail "the staging API package versions are malformed."
            jq -e --argjson expected "$(jq -r '.version_count' <<<"$package_json")" \
              'type == "array" and length == $expected and
               ([.[].id] | length) == ([.[].id] | unique | length) and
               ([.[].name] | length) == ([.[].name] | unique | length) and
               all(.[];
                 (.id | type) == "number" and .id > 0 and
                 (.name | type) == "string" and (.name | test("^sha256:[0-9a-f]{64}$")) and
                 .metadata.package_type == "container" and
                 ((.metadata.container.tags // []) | type) == "array" and
                 ((.metadata.container.tags // []) | length) == ((.metadata.container.tags // []) | unique | length) and
                 all((.metadata.container.tags // [])[]; type == "string"))' \
              <<<"$versions_json" >/dev/null \
              || fail "the active package version inventory is incomplete or non-unique."

            deleted_versions_json="$(
              gh api --paginate \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}/versions?state=deleted&per_page=100" |
                jq -s 'add'
            )" || fail "the deleted staging API package versions could not be read."
            jq -e \
              'type == "array" and
               length == 0 and
               ([.[].id] | length) == ([.[].id] | unique | length) and
               all(.[]; (.id | type) == "number" and .id > 0)' \
              <<<"$deleted_versions_json" >/dev/null \
              || fail "a deleted or duplicate package version conflicts with the exact predecessor tag."

            matches_json="$(
              jq -c --arg sha "$EXPECTED_SOURCE_SHA" \
                '[.[] | select(((.metadata.container.tags // []) | index($sha)) != null)]' \
                <<<"$versions_json"
            )"
            match_count="$(jq -r 'length' <<<"$matches_json")"
            case "$match_count" in
              0) ;;
              1)
                existing_digest="$(jq -r '.[0].name' <<<"$matches_json")"
                [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
                  || fail "the existing exact predecessor tag has an invalid digest."
                selected_version_id="$(jq -r '.[0].id' <<<"$matches_json")"
                selected_version_json="$(
                  gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                    "/user/packages/container/${PACKAGE_NAME}/versions/${selected_version_id}"
                )" || fail "the exact predecessor package version could not be re-read."
                jq -e \
                  --arg digest "$existing_digest" \
                  --arg sha "$EXPECTED_SOURCE_SHA" \
                  --argjson id "$selected_version_id" \
                  '.id == $id and .name == $digest and
                   .metadata.package_type == "container" and
                   (.metadata.container.tags // []) == [$sha]' \
                  <<<"$selected_version_json" >/dev/null \
                  || fail "the exact predecessor package version changed during selection."
                publish="false"
                initial_tag_state="present"
                ;;
              *) fail "the exact predecessor tag is not unique." ;;
            esac
          fi

          if [[ "$VERIFY_EXISTING_ONLY" == "true" ]]; then
            [[ "$publish" == "false" && "$initial_tag_state" == "present" && "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || fail "verify-existing-only requires an already-present exact predecessor tag and forbids publication."
          fi

          {
            echo "existing_digest=${existing_digest}"
            echo "initial_tag_state=${initial_tag_state}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

      - name: Prove verify-existing-only cannot publish
        if: inputs.verify_existing_only == true
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.package-state.outputs.existing_digest }}
          INITIAL_TAG_STATE: ${{ steps.package-state.outputs.initial_tag_state }}
          PUBLISH: ${{ steps.package-state.outputs.publish }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH" == "false" ]]
          [[ "$INITIAL_TAG_STATE" == "present" ]]
          [[ "$EXISTING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Check out the fixed public predecessor commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: modvolt/Site-Logbook
          ref: c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3

      - name: Prove exact source tree and exact-0104 migration bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_SOURCE_TREE" ]]
          mapfile -t sql_files < <(find lib/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort)
          [[ "${#sql_files[@]}" == "104" ]]
          [[ "${sql_files[-1]}" == "0104_thin_sheva_callister.sql" ]]
          [[ "${sql_files[*]}" != *"0100_"* && "${sql_files[*]}" != *"0105_"* ]]
          jq -e \
            '.entries | length == 104 and
             .[-1].idx == 104 and
             .[-1].tag == "0104_thin_sheva_callister" and
             all(.[]; (.tag | startswith("0100_")) == false) and
             all(.[]; (.tag | startswith("0105_")) == false)' \
            lib/db/migrations/meta/_journal.json >/dev/null

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate predecessor API build without registry write
        if: inputs.verify_existing_only == false && steps.package-state.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/modvolt/site-logbook-staging-api:c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          labels: |
            org.opencontainers.image.source=https://github.com/modvolt/Site-Logbook
            org.opencontainers.image.revision=c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
            org.opencontainers.image.url=https://github.com/modvolt/Site-Logbook/commit/c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          build-args: BUILD_SHA=c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          cache-from: type=gha,scope=staging-predecessor-api
          cache-to: type=gha,mode=max,scope=staging-predecessor-api
          provenance: mode=max,version=v0.2
          sbom: true

      - name: Recheck exact predecessor tag absence immediately before publication
        if: inputs.verify_existing_only == false && steps.package-state.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
        run: |
          set -euo pipefail
          inventory_json="$(
            gh api --paginate --header 'X-GitHub-Api-Version: 2022-11-28' \
              '/user/packages?package_type=container&visibility=private&per_page=100' |
              jq -s 'add'
          )"
          jq -e 'type == "array"' <<<"$inventory_json" >/dev/null
          matching_packages_json="$(
            jq -c --arg name "$PACKAGE_NAME" \
              '[.[] | select((.name | ascii_downcase) == $name)]' \
              <<<"$inventory_json"
          )"
          jq -e '([.[].id] | length) == ([.[].id] | unique | length)' \
            <<<"$matching_packages_json" >/dev/null
          package_count="$(jq -r 'length' <<<"$matching_packages_json")"
          [[ "$package_count" == "0" || "$package_count" == "1" ]]
          if [[ "$package_count" == "1" ]]; then
            package_json="$(
              gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}"
            )"
            jq -e \
              --arg package "$PACKAGE_NAME" \
              '(.id | type) == "number" and .id > 0 and
               .name == $package and .package_type == "container" and
               (.owner.login | ascii_downcase) == "modvolt" and
               .visibility == "private" and
               (.repository.full_name | ascii_downcase) == "modvolt/site-logbook-registry" and
               .repository.private == true and
               (.version_count | type) == "number" and .version_count >= 0' \
              <<<"$package_json" >/dev/null
            versions_json="$(
              gh api --paginate --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}/versions?state=active&per_page=100" |
                jq -s 'add'
            )"
            jq -e --arg sha "$EXPECTED_SOURCE_SHA" --argjson expected "$(jq -r '.version_count' <<<"$package_json")" \
              'type == "array" and length == $expected and
               ([.[].id] | length) == ([.[].id] | unique | length) and
               ([.[].name] | length) == ([.[].name] | unique | length) and
               all(.[];
                 (.id | type) == "number" and .id > 0 and
                 (.name | type) == "string" and (.name | test("^sha256:[0-9a-f]{64}$")) and
                 .metadata.package_type == "container" and
                 ((.metadata.container.tags // []) | type) == "array" and
                 ((.metadata.container.tags // []) | length) == ((.metadata.container.tags // []) | unique | length) and
                 all((.metadata.container.tags // [])[]; type == "string")) and
               ([.[] | select(((.metadata.container.tags // []) | index($sha)) != null)] | length == 0)' \
              <<<"$versions_json" >/dev/null
            deleted_versions_json="$(
              gh api --paginate --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}/versions?state=deleted&per_page=100" |
                jq -s 'add'
            )"
            jq -e \
              'type == "array" and
               length == 0 and
               ([.[].id] | length) == ([.[].id] | unique | length) and
               all(.[]; (.id | type) == "number" and .id > 0)' \
              <<<"$deleted_versions_json" >/dev/null
          fi

      - name: Build and publish fixed predecessor API image
        id: predecessor-api
        if: inputs.verify_existing_only == false && steps.package-state.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/modvolt/site-logbook-staging-api:c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          labels: |
            org.opencontainers.image.source=https://github.com/modvolt/Site-Logbook
            org.opencontainers.image.revision=c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
            org.opencontainers.image.url=https://github.com/modvolt/Site-Logbook/commit/c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          build-args: BUILD_SHA=c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          cache-from: type=gha,scope=staging-predecessor-api
          cache-to: type=gha,mode=max,scope=staging-predecessor-api
          provenance: mode=max,version=v0.2
          sbom: true

      - name: Select exact predecessor API digest
        id: selected-digest
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.predecessor-api.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.package-state.outputs.existing_digest }}
          PUBLISHED: ${{ steps.package-state.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISHED" == "true" ]]; then digest="$BUILT_DIGEST"; else digest="$EXISTING_DIGEST"; fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify private exact-digest predecessor package and attestations
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.selected-digest.outputs.digest }}
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
          VERIFICATION_ATTEMPTS: "36"
          VERIFICATION_POLL_SECONDS: "5"
        run: |
          set -euo pipefail

          retry_verification() {
            local diagnostic_code="$1"
            echo "::notice title=Fixed predecessor verifier::attempt ${attempt}/${VERIFICATION_ATTEMPTS}: ${diagnostic_code}"
            if [[ "$attempt" == "$VERIFICATION_ATTEMPTS" ]]; then
              echo "Fixed predecessor verification exhausted after ${VERIFICATION_ATTEMPTS} attempts: ${diagnostic_code}." >&2
              exit 1
            fi
            sleep "$VERIFICATION_POLL_SECONDS"
          }

          [[ "$VERIFICATION_ATTEMPTS" == "36" ]]
          [[ "$VERIFICATION_POLL_SECONDS" == "5" ]]
          verification_succeeded="false"
          for attempt in $(seq 1 "$VERIFICATION_ATTEMPTS"); do
            diagnostic_code="PACKAGE_METADATA_NOT_READY"
            package_json="$(
              gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}" 2>/dev/null
            )" || package_json=""
            versions_json="$(
              gh api --paginate --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}/versions?state=active&per_page=100" 2>/dev/null |
                jq -s 'add'
            )" || versions_json=""
            deleted_versions_json="$(
              gh api --paginate --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${PACKAGE_NAME}/versions?state=deleted&per_page=100" 2>/dev/null |
                jq -s 'add'
            )" || deleted_versions_json=""
            if ! jq -e \
              --arg package "$PACKAGE_NAME" \
              '(.id | type) == "number" and .id > 0 and
               .name == $package and .package_type == "container" and
               (.owner.login | ascii_downcase) == "modvolt" and
               .visibility == "private" and
               (.repository.full_name | ascii_downcase) == "modvolt/site-logbook-registry" and
               .repository.private == true and
               (.version_count | type) == "number" and .version_count >= 0' \
              <<<"$package_json" >/dev/null 2>&1
            then
              diagnostic_code="PACKAGE_METADATA_NOT_READY"
            elif ! jq -e --arg digest "$EXPECTED_DIGEST" --arg sha "$EXPECTED_SOURCE_SHA" --argjson expected "$(jq -r '.version_count' <<<"$package_json")" \
                'type == "array" and length == $expected and
                 ([.[].id] | length) == ([.[].id] | unique | length) and
                 ([.[].name] | length) == ([.[].name] | unique | length) and
                 all(.[];
                   (.id | type) == "number" and .id > 0 and
                   (.name | type) == "string" and (.name | test("^sha256:[0-9a-f]{64}$")) and
                   .metadata.package_type == "container" and
                   ((.metadata.container.tags // []) | type) == "array" and
                   ((.metadata.container.tags // []) | length) == ((.metadata.container.tags // []) | unique | length) and
                   all((.metadata.container.tags // [])[]; type == "string")) and
                 ([.[] | select(((.metadata.container.tags // []) | index($sha)) != null)] |
                  length == 1 and .[0].name == $digest)' \
                <<<"$versions_json" >/dev/null 2>&1
            then
              diagnostic_code="ACTIVE_VERSION_INVENTORY_NOT_READY"
            elif ! jq -e \
                'type == "array" and
                 length == 0 and
                 ([.[].id] | length) == ([.[].id] | unique | length) and
                 all(.[]; (.id | type) == "number" and .id > 0)' \
                <<<"$deleted_versions_json" >/dev/null 2>&1
            then
              diagnostic_code="DELETED_VERSION_INVENTORY_NOT_READY"
            else
              diagnostic_code="SELECTED_VERSION_REFETCH_NOT_READY"
              version_json="$(
                jq -c --arg sha "$EXPECTED_SOURCE_SHA" \
                  '.[] | select(((.metadata.container.tags // []) | index($sha)) != null)' \
                  <<<"$versions_json"
              )"
              version_id="$(jq -r '.id' <<<"$version_json")"
              selected_version_json="$(
                gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                  "/user/packages/container/${PACKAGE_NAME}/versions/${version_id}" 2>/dev/null
              )" || selected_version_json=""
              if ! jq -e \
                --arg digest "$EXPECTED_DIGEST" \
                --arg sha "$EXPECTED_SOURCE_SHA" \
                --argjson id "$version_id" \
                '.id == $id and .name == $digest and
                 .metadata.package_type == "container" and
                 (.metadata.container.tags // []) == [$sha]' \
                <<<"$selected_version_json" >/dev/null 2>&1
              then
                retry_verification "$diagnostic_code"
                continue
              fi
              reference="${REGISTRY_REPOSITORY}@${EXPECTED_DIGEST}"
              manifest_json="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' 2>/dev/null)" || manifest_json=""
              runnable_digest_candidate="$(
                jq -r '[.manifests[]? | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")][0].digest // empty' \
                  <<<"$manifest_json" 2>/dev/null
              )" || runnable_digest_candidate=""
              if [[ "$runnable_digest_candidate" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                image_json="$(
                  docker buildx imagetools inspect \
                    "${REGISTRY_REPOSITORY}@${runnable_digest_candidate}" \
                    --format '{{json .Image}}' 2>/dev/null
                )" || image_json=""
              else
                image_json=""
              fi
              provenance_json="$(docker buildx imagetools inspect "$reference" --format '{{json .Provenance}}' 2>/dev/null)" || provenance_json=""
              sbom_json="$(docker buildx imagetools inspect "$reference" --format '{{json .SBOM}}' 2>/dev/null)" || sbom_json=""
              if ! jq -e --arg digest "$EXPECTED_DIGEST" \
                '.schemaVersion == 2 and
                 .mediaType == "application/vnd.oci.image.index.v1+json" and
                 .digest == $digest and
                 ((.manifests // []) as $manifests |
                  ($manifests | length) == 2 and
                  ([ $manifests[].digest ] | length) == ([ $manifests[].digest ] | unique | length) and
                  all($manifests[];
                    .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                    (.size | type) == "number" and .size > 0 and
                    (.digest | test("^sha256:[0-9a-f]{64}$"))) and
                  ($manifests | map(select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest"))) as $runnable |
                  ($manifests | map(select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"))) as $attestations |
                  ($runnable | length) == 1 and
                  $runnable[0].platform.os == "linux" and
                  $runnable[0].platform.architecture == "amd64" and
                  ($runnable[0].digest | test("^sha256:[0-9a-f]{64}$")) and
                  ($attestations | length) == 1 and
                  all($attestations[];
                    .annotations["vnd.docker.reference.digest"] == $runnable[0].digest and
                    .platform.os == "unknown" and .platform.architecture == "unknown"))' \
                <<<"$manifest_json" >/dev/null 2>&1
              then
                diagnostic_code="OCI_INDEX_NOT_READY"
              elif ! jq -e --arg sha "$EXPECTED_SOURCE_SHA" \
                  '.architecture == "amd64" and .os == "linux" and
                   .config.Labels["org.opencontainers.image.source"] == "https://github.com/modvolt/Site-Logbook" and
                   .config.Labels["org.opencontainers.image.revision"] == $sha and
                   .config.Labels["org.opencontainers.image.url"] == ("https://github.com/modvolt/Site-Logbook/commit/" + $sha) and
                   ((.config.Env // []) | index("BUILD_SHA=" + $sha)) != null' \
                  <<<"$image_json" >/dev/null 2>&1
              then
                diagnostic_code="RUNTIME_METADATA_NOT_READY"
              elif ! jq -e --arg sha "$EXPECTED_SOURCE_SHA" \
                  '.SLSA.buildType == "https://mobyproject.org/buildkit@v1" and
                   .SLSA.invocation.environment.platform == "linux/amd64" and
                   .SLSA.metadata.completeness.parameters == true and
                   .SLSA.metadata.completeness.environment == true and
                   .SLSA.invocation.configSource.entryPoint == "artifacts/api-server/Dockerfile" and
                   .SLSA.invocation.parameters.args["build-arg:BUILD_SHA"] == $sha and
                   ((.SLSA.materials // []) | length) > 0 and
                   (any(.SLSA.materials[]?;
                     .digest.sha256 == "235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7")) and
                   (.SLSA.metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs as $vcs |
                    $vcs.revision == $sha and
                    (($vcs.source | ascii_downcase) |
                     test("^(https://github\\.com/modvolt/site-logbook(?:\\.git)?|git\\+https://github\\.com/modvolt/site-logbook(?:\\.git)?|git@github\\.com:modvolt/site-logbook\\.git)$")))' \
                  <<<"$provenance_json" >/dev/null 2>&1
              then
                diagnostic_code="PROVENANCE_NOT_READY"
              elif ! jq -e '.SPDX.SPDXID == "SPDXRef-DOCUMENT" and
                       .SPDX.dataLicense == "CC0-1.0" and
                       (.SPDX.spdxVersion == "SPDX-2.2" or .SPDX.spdxVersion == "SPDX-2.3") and
                       (.SPDX.documentNamespace | type) == "string" and
                       (.SPDX.documentNamespace | test("^https://")) and
                       (.SPDX.creationInfo.created | type) == "string" and
                       (.SPDX.creationInfo.created | length) > 0 and
                       ((.SPDX.creationInfo.creators // []) | length) > 0 and
                       all(.SPDX.creationInfo.creators[]; type == "string" and length > 0) and
                       ((.SPDX.packages // []) as $packages |
                        ($packages | length) > 0 and
                        ([ $packages[].SPDXID ] | length) == ([ $packages[].SPDXID ] | unique | length) and
                        all($packages[];
                          (.SPDXID | type) == "string" and (.SPDXID | length) > 0 and
                          (.name | type) == "string" and (.name | length) > 0) and
                        ((.SPDX.relationships // []) as $relationships |
                         ($relationships | length) > 0 and
                         any($relationships[] as $relationship;
                           $relationship.relationshipType == "CONTAINS" and
                           (([ $packages[].SPDXID ] | index($relationship.spdxElementId)) != null or
                            ([ $packages[].SPDXID ] | index($relationship.relatedSpdxElement)) != null))))' \
                  <<<"$sbom_json" >/dev/null 2>&1
              then
                diagnostic_code="SBOM_NOT_READY"
              else
                runnable_digest="$(
                  jq -r '[.manifests[] | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")][0].digest' \
                    <<<"$manifest_json"
                )"
                active_version_count="$(jq -r 'length' <<<"$versions_json")"
                package_version_count="$(jq -r '.version_count' <<<"$package_json")"
                deleted_version_count="$(jq -r 'length' <<<"$deleted_versions_json")"
                runtime_source="$(jq -r '.config.Labels["org.opencontainers.image.source"]' <<<"$image_json")"
                runtime_revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"]' <<<"$image_json")"
                runtime_url="$(jq -r '.config.Labels["org.opencontainers.image.url"]' <<<"$image_json")"
                provenance_vcs_source="$(jq -r '.SLSA.metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.source' <<<"$provenance_json")"
                provenance_vcs_revision="$(jq -r '.SLSA.metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.revision' <<<"$provenance_json")"
                provenance_dockerfile="$(jq -r '.SLSA.invocation.configSource.entryPoint' <<<"$provenance_json")"
                provenance_build_sha="$(jq -r '.SLSA.invocation.parameters.args["build-arg:BUILD_SHA"]' <<<"$provenance_json")"
                sbom_version="$(jq -r '.SPDX.spdxVersion' <<<"$sbom_json")"
                sbom_package_count="$(jq -r '(.SPDX.packages // []) | length' <<<"$sbom_json")"
                sbom_relationship_count="$(jq -r '(.SPDX.relationships // []) | length' <<<"$sbom_json")"
                jq -n \
                  --argjson activeVersionCount "$active_version_count" \
                  --argjson deletedVersionCount "$deleted_version_count" \
                  --arg digest "$EXPECTED_DIGEST" \
                  --arg packageId "$(jq -r '.id' <<<"$package_json")" \
                  --arg packageName "$PACKAGE_NAME" \
                  --argjson packageVersionCount "$package_version_count" \
                  --arg provenanceBuildSha "$provenance_build_sha" \
                  --arg provenanceDockerfile "$provenance_dockerfile" \
                  --arg provenanceVcsRevision "$provenance_vcs_revision" \
                  --arg provenanceVcsSource "$provenance_vcs_source" \
                  --arg repository "$(jq -r '.repository.full_name' <<<"$package_json")" \
                  --arg registryRepository "$REGISTRY_REPOSITORY" \
                  --arg runnableManifestDigest "$runnable_digest" \
                  --arg runtimeRevision "$runtime_revision" \
                  --arg runtimeSource "$runtime_source" \
                  --arg runtimeUrl "$runtime_url" \
                  --argjson sbomPackageCount "$sbom_package_count" \
                  --argjson sbomRelationshipCount "$sbom_relationship_count" \
                  --arg sbomVersion "$sbom_version" \
                  --arg sourceSha "$EXPECTED_SOURCE_SHA" \
                  --arg versionId "$(jq -r '.id' <<<"$selected_version_json")" \
                  '{packageName: $packageName, packageId: $packageId, visibility: "private", repository: $repository, registryRepository: $registryRepository, sourceSha: $sourceSha, versionId: $versionId, digest: $digest, runnableManifestDigest: $runnableManifestDigest, platform: "linux/amd64", activeInventoryPaginated: true, activeVersionCount: $activeVersionCount, packageVersionCount: $packageVersionCount, visibleDeletedTagConflictChecked: true, deletedVersionCount: $deletedVersionCount, deletedHistoryScope: "visible-package-versions-only", selectedVersionRefetched: true, remoteManifestVerified: true, runtimeMetadata: {source: $runtimeSource, revision: $runtimeRevision, url: $runtimeUrl, buildSha: $sourceSha}, provenance: {buildType: "https://mobyproject.org/buildkit@v1", vcsSource: $provenanceVcsSource, vcsRevision: $provenanceVcsRevision, dockerfile: $provenanceDockerfile, buildSha: $provenanceBuildSha, baseImageDigest: "sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7"}, sbom: {spdxVersion: $sbomVersion, packageCount: $sbomPackageCount, relationshipCount: $sbomRelationshipCount}}' \
                  > predecessor-package.json
                verification_succeeded="true"
                echo "::notice title=Fixed predecessor verifier::verification succeeded on attempt ${attempt}/${VERIFICATION_ATTEMPTS}"
                break
              fi
            fi
            retry_verification "$diagnostic_code"
          done
          [[ "$verification_succeeded" == "true" ]]

      - name: Create secret-free fixed predecessor publication evidence
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          DIGEST: ${{ steps.selected-digest.outputs.digest }}
          INITIAL_TAG_STATE: ${{ steps.package-state.outputs.initial_tag_state }}
          PUBLISHED: ${{ steps.package-state.outputs.publish }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          VERIFY_EXISTING_ONLY: ${{ inputs.verify_existing_only }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISHED" == "true" ]]; then registry_action=published; else registry_action=verified-noop; fi
          if [[ "$VERIFY_EXISTING_ONLY" == "true" ]]; then
            [[ "$registry_action" == "verified-noop" && "$INITIAL_TAG_STATE" == "present" ]]
          fi
          jq -n \
            --arg callerRepository "$CALLER_REPOSITORY" \
            --arg callerWorkflowRef "$CALLER_WORKFLOW_REF" \
            --arg digest "$DIGEST" \
            --arg initialTagState "$INITIAL_TAG_STATE" \
            --arg registryAction "$registry_action" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg runId "$RUN_ID" \
            --arg sourceSha "$EXPECTED_SOURCE_SHA" \
            --arg sourceTree "$EXPECTED_SOURCE_TREE" \
            --slurpfile package predecessor-package.json \
            '{schemaVersion: 2, kind: "site-logbook-staging-predecessor-api", sourceSha: $sourceSha, sourceTree: $sourceTree, migrationContract: {count: 104, tail: "0104_thin_sheva_callister", excluded0100: true, excluded0105: true}, callerRepository: $callerRepository, callerWorkflowRef: $callerWorkflowRef, initialTagState: $initialTagState, registryAction: $registryAction, publisherRun: {id: $runId, attempt: $runAttempt}, toolchain: {buildx: "v0.34.1", buildkitImage: "moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f"}, image: ("ghcr.io/modvolt/site-logbook-staging-api@" + $digest), package: $package[0]}' \
            > staging-predecessor-image.json
          jq -e --arg digest "$DIGEST" --arg sha "$EXPECTED_SOURCE_SHA" --arg tree "$EXPECTED_SOURCE_TREE" \
            '.schemaVersion == 2 and
             .kind == "site-logbook-staging-predecessor-api" and
             .sourceSha == $sha and .sourceTree == $tree and
             .migrationContract == {count: 104, tail: "0104_thin_sheva_callister", excluded0100: true, excluded0105: true} and
             .toolchain == {buildx: "v0.34.1", buildkitImage: "moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f"} and
             (.registryAction == "published" or .registryAction == "verified-noop") and
             .image == ("ghcr.io/modvolt/site-logbook-staging-api@" + $digest) and
             .package.digest == $digest and .package.sourceSha == $sha and
             .package.visibility == "private" and .package.platform == "linux/amd64" and
             .package.activeInventoryPaginated == true and .package.activeVersionCount >= 1 and
             .package.packageVersionCount == .package.activeVersionCount and
             .package.visibleDeletedTagConflictChecked == true and .package.deletedVersionCount == 0 and
             .package.deletedHistoryScope == "visible-package-versions-only" and
             .package.selectedVersionRefetched == true and .package.remoteManifestVerified == true and
             .package.runtimeMetadata == {source: "https://github.com/modvolt/Site-Logbook", revision: $sha, url: ("https://github.com/modvolt/Site-Logbook/commit/" + $sha), buildSha: $sha} and
             .package.provenance.buildType == "https://mobyproject.org/buildkit@v1" and
             .package.provenance.vcsRevision == $sha and .package.provenance.dockerfile == "artifacts/api-server/Dockerfile" and
             .package.provenance.buildSha == $sha and .package.provenance.baseImageDigest == "sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7" and
             (.package.provenance.vcsSource | ascii_downcase | test("^(https://github\\.com/modvolt/site-logbook(?:\\.git)?|git\\+https://github\\.com/modvolt/site-logbook(?:\\.git)?|git@github\\.com:modvolt/site-logbook\\.git)$")) and
             (.package.sbom.spdxVersion == "SPDX-2.2" or .package.sbom.spdxVersion == "SPDX-2.3") and
             .package.sbom.packageCount > 0 and .package.sbom.relationshipCount > 0' \
            staging-predecessor-image.json >/dev/null
          sha256sum staging-predecessor-image.json > staging-predecessor-image.sha256
          [[ "$(awk '{print $1}' staging-predecessor-image.sha256)" =~ ^[0-9a-f]{64}$ ]]

      - name: Upload immutable predecessor API evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-predecessor-api-c3a83a0e68e4c2eb4b2a64661e0396c81f1adde3
          path: |
            staging-predecessor-image.json
            staging-predecessor-image.sha256
          if-no-files-found: error
          retention-days: 30
