name: Publish immutable staging images (private caller, no deploy)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character Site-Logbook commit SHA selected for publication
        required: true
        type: string
      source_ref:
        description: Approved Site-Logbook candidate branch
        required: true
        type: string
      source_pr_number:
        description: Open draft PR whose head is the selected source SHA
        required: true
        type: number
      publication_stage:
        description: Explicit two-stage gate (preflight-only or complete)
        required: true
        type: string
      expected_preflight_digest:
        description: Preflight digest proven by the preceding preflight-only run; empty for preflight-only
        required: false
        default: ""
        type: string
      confirm_registry_publication:
        description: Publish only the explicitly selected staging stage to private GHCR without deploying it
        required: true
        type: boolean
    secrets:
      packages_metadata_token:
        description: Dedicated classic PAT with exactly read:packages for private Packages REST metadata
        required: true

permissions: {}

concurrency:
  group: site-logbook-images-publication
  cancel-in-progress: false

jobs:
  validate-public-source:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact green public source candidate
        shell: bash
        env:
          APPROVED_SOURCE_REF: agent/phase16c3-staging-preflight
          PUBLICATION_CONFIRMED: ${{ inputs.confirm_registry_publication }}
          PUBLICATION_STAGE: ${{ inputs.publication_stage }}
          EXPECTED_PREFLIGHT_DIGEST: ${{ inputs.expected_preflight_digest }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_REPOSITORY: modvolt/Site-Logbook
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          fail() {
            echo "Public Site-Logbook source validation failed: $1" >&2
            exit 1
          }

          public_source_api() {
            local url="$1"
            case "$url" in
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/"*) ;;
              *) fail "unexpected public source API origin." ;;
            esac
            curl --disable \
              --fail-with-body --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 30 \
              --header 'Accept: application/vnd.github+json' \
              --header 'User-Agent: site-logbook-private-publisher' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$url"
          }

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "source_sha must be 40 lowercase hexadecimal characters."
          [[ "$SOURCE_REF" == "$APPROVED_SOURCE_REF" ]] \
            || fail "source_ref must equal the approved candidate branch."
          [[ "$SOURCE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
            || fail "source_pr_number must be a positive integer."
          [[ "$PUBLICATION_CONFIRMED" == "true" ]] \
            || fail "registry publication confirmation is required."
          [[ "$PUBLICATION_STAGE" == "preflight-only" || "$PUBLICATION_STAGE" == "complete" ]] \
            || fail "publication_stage must be preflight-only or complete."
          if [[ "$PUBLICATION_STAGE" == "preflight-only" ]]; then
            [[ -z "$EXPECTED_PREFLIGHT_DIGEST" ]] \
              || fail "expected_preflight_digest must be empty for preflight-only."
          else
            [[ "$EXPECTED_PREFLIGHT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || fail "complete requires the exact preflight digest from the preflight-only evidence."
          fi

          ref_json="$(
            public_source_api \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/git/ref/heads/${SOURCE_REF}"
          )" || fail "the public source branch head could not be read."
          ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          [[ "$ref_sha" == "$SOURCE_SHA" ]] \
            || fail "source_sha is not the current approved candidate branch head."

          pr_json="$(
            public_source_api \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}"
          )" || fail "the public source PR could not be read."
          jq -e \
            --arg branch "$SOURCE_REF" \
            --arg repository "${SOURCE_REPOSITORY,,}" \
            --arg sha "$SOURCE_SHA" \
            '.state == "open" and
             .draft == true and
             .merged == false and
             (.head.repo.full_name | ascii_downcase) == $repository and
             .head.ref == $branch and
             .head.sha == $sha and
             .base.ref == "main"' \
            <<<"$pr_json" >/dev/null \
            || fail "source PR must be the open draft candidate with the exact source head."

          quality_json="$(
            public_source_api \
              "https://api.github.com/repos/${SOURCE_REPOSITORY}/actions/workflows/quality-gate.yml/runs?head_sha=${SOURCE_SHA}&event=pull_request&per_page=100"
          )" || fail "the public source Quality gate could not be read."
          jq -e \
            --arg branch "$SOURCE_REF" \
            --argjson pr "$SOURCE_PR_NUMBER" \
            --arg repository "${SOURCE_REPOSITORY,,}" \
            --arg sha "$SOURCE_SHA" \
            '[.workflow_runs[] |
              select(
                .name == "Quality gate" and
                .path == ".github/workflows/quality-gate.yml" and
                .event == "pull_request" and
                .head_branch == $branch and
                .head_sha == $sha and
                any(.pull_requests[]?; .number == $pr) and
                (.head_repository.full_name | ascii_downcase) == $repository
              )] |
             sort_by([.run_number, .run_attempt]) |
             last |
             .status == "completed" and .conclusion == "success"' \
            <<<"$quality_json" >/dev/null \
            || fail "no successful exact-SHA pull-request Quality gate was found."

  publish-staging-images:
    needs: validate-public-source
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require dedicated read-only Packages metadata credential
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
          REGISTRY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          fail() {
            echo "Private Packages metadata credential validation failed: $1" >&2
            exit 1
          }

          [[ -n "$GH_TOKEN" ]] \
            || fail "the named Packages metadata credential is required."
          [[ -n "$REGISTRY_GITHUB_TOKEN" ]] \
            || fail "the caller GITHUB_TOKEN is required for registry publication."
          [[ "$GH_TOKEN" != "$REGISTRY_GITHUB_TOKEN" ]] \
            || fail "the Packages metadata credential must be distinct from GITHUB_TOKEN."

          umask 077
          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          gh api --include \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            /user >"$response_file" \
            || fail "the Packages metadata credential identity could not be read."

          oauth_scopes="$(
            awk 'BEGIN { IGNORECASE=1 }
              /^x-oauth-scopes:/ {
                sub(/^[^:]*:[[:space:]]*/, "")
                gsub(/\r/, "")
                print
                exit
              }' "$response_file"
          )"
          normalized_scopes="$(
            tr ',' '\n' <<<"$oauth_scopes" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              sed '/^$/d' |
              LC_ALL=C sort -u |
              paste -sd, -
          )"
          [[ "$normalized_scopes" == "read:packages" ]] \
            || fail "the Packages metadata credential must have exactly the read:packages scope."

          identity_json="$(sed -n '/^[[:space:]]*{/,$p' "$response_file")"
          jq -e \
            '.login == "modvolt" and
             .id == 289280891 and
             .type == "User"' \
            <<<"$identity_json" >/dev/null \
            || fail "the Packages metadata credential must belong to the exact modvolt user."

      - name: Require private caller and exact staged package state
        id: package-state
        shell: bash
        env:
          APPROVED_CALLER_REPOSITORY: modvolt/site-logbook-registry
          CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REPOSITORY_OWNER: ${{ github.repository_owner }}
          EXPECTED_PREFLIGHT_DIGEST: ${{ inputs.expected_preflight_digest }}
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
          PRIVATE_REGISTRY_OWNER: modvolt
          PUBLICATION_CONFIRMED: ${{ inputs.confirm_registry_publication }}
          PUBLICATION_STAGE: ${{ inputs.publication_stage }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          fail() {
            echo "Private staging image publication preflight failed: $1" >&2
            exit 1
          }

          [[ "$PUBLICATION_CONFIRMED" == "true" ]] \
            || fail "registry publication confirmation is required."
          [[ "$PUBLICATION_STAGE" == "preflight-only" || "$PUBLICATION_STAGE" == "complete" ]] \
            || fail "publication stage is invalid."
          [[ "${CALLER_REPOSITORY,,}" == "$APPROVED_CALLER_REPOSITORY" ]] \
            || fail "the reusable workflow must be called by the approved private publisher repository."
          [[ "${CALLER_REPOSITORY_OWNER,,}" == "$PRIVATE_REGISTRY_OWNER" ]] \
            || fail "the reusable workflow must be called by the approved registry owner."

          caller_json="$(GH_TOKEN="$CALLER_GITHUB_TOKEN" gh api "repos/${CALLER_REPOSITORY}")"
          jq -e \
            --arg caller "${CALLER_REPOSITORY,,}" \
            --arg owner "$PRIVATE_REGISTRY_OWNER" \
            '(.full_name | ascii_downcase) == $caller and
             (.owner.login | ascii_downcase) == $owner and
             .private == true' \
            <<<"$caller_json" >/dev/null \
            || fail "the caller repository must be private and owned by modvolt."

          package_names=( \
            site-logbook-staging-preflight \
            site-logbook-staging-mailpit \
            site-logbook-staging-api \
            site-logbook-staging-web \
            site-logbook-staging-alert-receiver
          )
          package_keys=(preflight mailpit api web alert_receiver)

          inventory_json="$(
            gh api --paginate \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              '/user/packages?package_type=container&visibility=private&per_page=100' |
              jq -s 'add'
          )" || fail "the authenticated private package inventory could not be read."
          jq -e 'type == "array"' <<<"$inventory_json" >/dev/null \
            || fail "the authenticated private package inventory is malformed."

          package_count() {
            local package_name="$1"
            jq -r --arg name "$package_name" \
              '[.[] | select((.name | ascii_downcase) == $name)] | length' \
              <<<"$inventory_json"
          }

          declare -A exact_digests=()
          state=""
          for index in "${!package_names[@]}"; do
            package_name="${package_names[$index]}"
            package_key="${package_keys[$index]}"
            exact_digests["$package_key"]=""
            count="$(package_count "$package_name")"
            [[ "$count" =~ ^[0-9]+$ ]] \
              || fail "inventory count for ${package_name} is invalid."
            [[ "$count" -le 1 ]] \
              || fail "duplicate package metadata found for ${package_name}."
            if [[ "$count" == "0" ]]; then
              state+="0"
              continue
            fi

            package_json="$(
              gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${package_name}"
            )" || fail "package metadata for ${package_name} could not be read."
            jq -e \
              --arg caller "$APPROVED_CALLER_REPOSITORY" \
              --arg package "$package_name" \
              '.name == $package and
               .package_type == "container" and
               (.owner.login | ascii_downcase) == "modvolt" and
               .visibility == "private" and
               (.repository.full_name | ascii_downcase) == $caller and
               .repository.private == true' \
              <<<"$package_json" >/dev/null \
              || fail "package ${package_name} is not private and linked to the approved private caller."

            versions_json="$(
              gh api --paginate \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${package_name}/versions?per_page=100" |
                jq -s 'add'
            )" || fail "package versions for ${package_name} could not be read."
            jq -e 'type == "array"' <<<"$versions_json" >/dev/null \
              || fail "package versions for ${package_name} are malformed."
            matches_json="$(
              jq -c \
                --arg sha "$SOURCE_SHA" \
                '[.[] |
                  select(((.metadata.container.tags // []) | index($sha)) != null)]' \
                <<<"$versions_json"
            )"
            match_count="$(jq -r 'length' <<<"$matches_json")"
            case "$match_count" in
              0)
                state+="0"
                ;;
              1)
                digest="$(jq -r '.[0].name' <<<"$matches_json")"
                [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
                  || fail "the exact source tag for ${package_name} has an invalid digest."
                exact_digests["$package_key"]="$digest"
                state+="1"
                ;;
              *)
                fail "the exact source tag for ${package_name} is not unique."
                ;;
            esac
          done

          publish_preflight=false
          publish_remaining=false
          case "${PUBLICATION_STAGE}:${state}" in
            preflight-only:00000)
              publish_preflight=true
              ;;
            preflight-only:10000)
              ;;
            complete:10000)
              publish_remaining=true
              ;;
            complete:11111)
              ;;
            *)
              fail "exact-SHA package state ${state} is not valid for ${PUBLICATION_STAGE}; partial recovery requires a separate review."
              ;;
          esac

          if [[ "$PUBLICATION_STAGE" == "complete" ]]; then
            [[ "${exact_digests[preflight]}" == "$EXPECTED_PREFLIGHT_DIGEST" ]] \
              || fail "the exact source tag does not resolve to the approved preflight digest."
          fi

          {
            echo "state=${state}"
            echo "publish_preflight=${publish_preflight}"
            echo "publish_remaining=${publish_remaining}"
            for package_key in "${package_keys[@]}"; do
              echo "${package_key}_digest=${exact_digests[$package_key]}"
            done
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact public source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: modvolt/Site-Logbook
          ref: ${{ inputs.source_sha }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive private staging image names
        id: names
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY_OWNER,,}"
          [[ "$owner" == "modvolt" ]] || exit 1
          {
            echo "preflight=ghcr.io/${owner}/site-logbook-staging-preflight"
            echo "mailpit=ghcr.io/${owner}/site-logbook-staging-mailpit"
            echo "api=ghcr.io/${owner}/site-logbook-staging-api"
            echo "web=ghcr.io/${owner}/site-logbook-staging-web"
            echo "alert_receiver=ghcr.io/${owner}/site-logbook-staging-alert-receiver"
          } >> "$GITHUB_OUTPUT"

      - name: Configure fail-closed private package verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/verify-private-package.sh" <<'VERIFY_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          package_name="${1:?package name required}"
          expected_digest="${2:?expected digest required}"
          evidence_path="${3:?evidence path required}"
          source_sha="${SOURCE_SHA:?source SHA required}"
          approved_caller="modvolt/site-logbook-registry"

          case "$package_name" in
            site-logbook-staging-preflight|site-logbook-staging-mailpit|site-logbook-staging-api|site-logbook-staging-web|site-logbook-staging-alert-receiver) ;;
            *) echo "Unexpected package name: ${package_name}" >&2; exit 1 ;;
          esac
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid expected digest for ${package_name}." >&2
            exit 1
          }
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid source SHA." >&2
            exit 1
          }

          for attempt in $(seq 1 12); do
            package_json="$(
              gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${package_name}" 2>/dev/null
            )" || package_json=""
            versions_json="$(
              gh api --paginate \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "/user/packages/container/${package_name}/versions?per_page=100" 2>/dev/null |
                jq -s 'add'
            )" || versions_json=""

            if jq -e \
              --arg caller "$approved_caller" \
              --arg package "$package_name" \
              '.name == $package and
               .package_type == "container" and
               (.owner.login | ascii_downcase) == "modvolt" and
               .visibility == "private" and
               (.repository.full_name | ascii_downcase) == $caller and
               .repository.private == true and
               .version_count >= 1' \
              <<<"$package_json" >/dev/null 2>&1 &&
              jq -e \
                --arg digest "$expected_digest" \
                --arg sha "$source_sha" \
                '[.[] |
                  select(((.metadata.container.tags // []) | index($sha)) != null)] |
                 length == 1 and .[0].name == $digest' \
                <<<"$versions_json" >/dev/null 2>&1
            then
              version_json="$(
                jq -c --arg sha "$source_sha" \
                  '.[] | select(((.metadata.container.tags // []) | index($sha)) != null)' \
                  <<<"$versions_json"
              )"
              repository="ghcr.io/modvolt/${package_name}"
              reference="${repository}@${expected_digest}"
              manifest_json="$(
                docker buildx imagetools inspect "$reference" \
                  --format '{{json .Manifest}}' 2>/dev/null
              )" || manifest_json=""
              provenance_json="$(
                docker buildx imagetools inspect "$reference" \
                  --format '{{json .Provenance}}' 2>/dev/null
              )" || provenance_json=""
              sbom_json="$(
                docker buildx imagetools inspect "$reference" \
                  --format '{{json .SBOM}}' 2>/dev/null
              )" || sbom_json=""

              if jq -e \
                --arg digest "$expected_digest" \
                '.schemaVersion == 2 and
                 .mediaType == "application/vnd.oci.image.index.v1+json" and
                 .digest == $digest and
                 ((.manifests // []) as $manifests |
                  ($manifests |
                    map(select(
                      (.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest"
                    ))) as $runnable |
                  ($manifests |
                    map(select(
                      .annotations["vnd.docker.reference.type"] == "attestation-manifest"
                    ))) as $attestations |
                  ($runnable | length) == 1 and
                  $runnable[0].mediaType == "application/vnd.oci.image.manifest.v1+json" and
                  $runnable[0].platform.os == "linux" and
                  $runnable[0].platform.architecture == "amd64" and
                  ($runnable[0].digest | test("^sha256:[0-9a-f]{64}$")) and
                  ($attestations | length) == 1 and
                  all($attestations[];
                    .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                    (.digest | test("^sha256:[0-9a-f]{64}$")) and
                    .annotations["vnd.docker.reference.digest"] == $runnable[0].digest and
                    .platform.os == "unknown" and
                    .platform.architecture == "unknown"))' \
                <<<"$manifest_json" >/dev/null 2>&1 &&
                jq -e \
                  '.SLSA.buildType == "https://mobyproject.org/buildkit@v1" and
                   .SLSA.invocation.environment.platform == "linux/amd64"' \
                  <<<"$provenance_json" >/dev/null 2>&1 &&
                jq -e \
                  '.SPDX.SPDXID == "SPDXRef-DOCUMENT" and
                   (.SPDX.spdxVersion | test("^SPDX-[0-9]+\\.[0-9]+$"))' \
                  <<<"$sbom_json" >/dev/null 2>&1
              then
                runnable_manifest_digest="$(
                  jq -r \
                    '[.manifests[] |
                      select(
                        (.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest"
                      )][0].digest' \
                    <<<"$manifest_json"
                )"
                jq -n \
                  --arg digest "$expected_digest" \
                  --arg packageId "$(jq -r '.id' <<<"$package_json")" \
                  --arg packageName "$package_name" \
                  --arg registryRepository "$repository" \
                  --arg repository "$(jq -r '.repository.full_name' <<<"$package_json")" \
                  --arg runnableManifestDigest "$runnable_manifest_digest" \
                  --arg sourceSha "$source_sha" \
                  --arg versionId "$(jq -r '.id' <<<"$version_json")" \
                  '{packageName: $packageName, packageId: $packageId, visibility: "private", repository: $repository, registryRepository: $registryRepository, sourceSha: $sourceSha, versionId: $versionId, digest: $digest, runnableManifestDigest: $runnableManifestDigest, platform: "linux/amd64", remoteManifestVerified: true, provenanceVerified: true, sbomVerified: true}' \
                  > "$evidence_path"
                exit 0
              fi
            fi

            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done

          echo "Package ${package_name} did not become a private caller-linked, exact-digest, attested package." >&2
          exit 1
          VERIFY_SCRIPT
          chmod 700 "${RUNNER_TEMP}/verify-private-package.sh"

          cat > "${RUNNER_TEMP}/assert-exact-tag-absent.sh" <<'ABSENCE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          package_name="${1:?package name required}"
          source_sha="${SOURCE_SHA:?source SHA required}"
          approved_caller="modvolt/site-logbook-registry"
          case "$package_name" in
            site-logbook-staging-preflight|site-logbook-staging-mailpit|site-logbook-staging-api|site-logbook-staging-web|site-logbook-staging-alert-receiver) ;;
            *) echo "Unexpected package name: ${package_name}" >&2; exit 1 ;;
          esac

          inventory_json="$(
            gh api --paginate \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              '/user/packages?package_type=container&visibility=private&per_page=100' |
              jq -s 'add'
          )"
          jq -e 'type == "array"' <<<"$inventory_json" >/dev/null
          count="$(
            jq -r --arg name "$package_name" \
              '[.[] | select((.name | ascii_downcase) == $name)] | length' \
              <<<"$inventory_json"
          )"
          [[ "$count" == "0" || "$count" == "1" ]]
          if [[ "$count" == "0" ]]; then exit 0; fi

          package_json="$(
            gh api --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/user/packages/container/${package_name}"
          )"
          jq -e \
            --arg caller "$approved_caller" \
            --arg package "$package_name" \
            '.name == $package and
             .package_type == "container" and
             .visibility == "private" and
             (.repository.full_name | ascii_downcase) == $caller and
             .repository.private == true' \
            <<<"$package_json" >/dev/null
          versions_json="$(
            gh api --paginate \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/user/packages/container/${package_name}/versions?per_page=100" |
              jq -s 'add'
          )"
          jq -e \
            --arg sha "$source_sha" \
            'type == "array" and
             ([.[] |
               select(((.metadata.container.tags // []) | index($sha)) != null)] |
              length == 0)' \
            <<<"$versions_json" >/dev/null || {
              echo "Exact source tag appeared before the approved push for ${package_name}; refusing overwrite." >&2
              exit 1
            }
          ABSENCE_SCRIPT
          chmod 700 "${RUNNER_TEMP}/assert-exact-tag-absent.sh"

      - name: Verify approved preflight package before completion
        if: inputs.publication_stage == 'complete'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.packages_metadata_token }}
          PREFLIGHT_DIGEST: ${{ inputs.expected_preflight_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/verify-private-package.sh" \
            site-logbook-staging-preflight \
            "$PREFLIGHT_DIGEST" \
            "${RUNNER_TEMP}/preflight-package.json"

      - name: Validate preflight image build without registry write
        if: inputs.publication_stage == 'preflight-only' && steps.package-state.outputs.publish_preflight == 'true'
