          cp "${RUNNER_TEMP}/alert-receiver-package.json" remaining-alert-receiver-package.json
          sha256sum remaining-alert-receiver-package.json > remaining-alert-receiver-package.sha256

      - name: Upload alert receiver partial-publication recovery evidence
        if: inputs.publication_stage == 'complete' && steps.package-state.outputs.publish_remaining == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remaining-alert-receiver-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            remaining-alert-receiver-package.json
            remaining-alert-receiver-package.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify all published packages remain private
        if: inputs.publication_stage == 'complete'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          jq -s -e \
            --arg sha "$SOURCE_SHA" \
            'length == 5 and
             (map(.packageName) | sort) == [
               "site-logbook-staging-alert-receiver",
               "site-logbook-staging-api",
               "site-logbook-staging-mailpit",
               "site-logbook-staging-preflight",
               "site-logbook-staging-web"
             ] and
             all(.[];
               .visibility == "private" and
               .repository == "modvolt/site-logbook-registry" and
               .sourceSha == $sha and
               .platform == "linux/amd64" and
               .activeInventoryPaginated == true and
               (.activeVersionCount | type) == "number" and .activeVersionCount >= 1 and
               .packageVersionCount == .activeVersionCount and
               .deletedInventoryMode == "not-queryable-exact-read-scope" and
               .visibleDeletedTagConflictChecked == false and
               .deletedVersionCount == null and
               .deletedHistoryScope == "external-audit-ledger-only" and
               .selectedVersionRefetched == true and
               .remoteManifestVerified == true and
               .runtimeMetadata.source == "https://github.com/modvolt/Site-Logbook" and
               .runtimeMetadata.revision == $sha and .runtimeMetadata.buildSha == $sha and
               .provenance.buildType == "https://mobyproject.org/buildkit@v1" and
               .provenance.vcsRevision == $sha and .provenance.buildSha == $sha and
               (.provenance.verifiedBaseImageDigests | type) == "array" and (.provenance.verifiedBaseImageDigests | length) > 0 and
               (.sbom.spdxVersion == "SPDX-2.2" or .sbom.spdxVersion == "SPDX-2.3") and
               .sbom.packageCount > 0 and .sbom.relationshipCount > 0)' \
            "${RUNNER_TEMP}/preflight-package.json" \
            "${RUNNER_TEMP}/mailpit-package.json" \
            "${RUNNER_TEMP}/api-package.json" \
            "${RUNNER_TEMP}/web-package.json" \
            "${RUNNER_TEMP}/alert-receiver-package.json" >/dev/null

      - name: Create and validate secret-free immutable image manifest
        if: inputs.publication_stage == 'complete'
        shell: bash
        env:
          ALERT_RECEIVER_DIGEST: ${{ steps.selected-alert-receiver.outputs.digest }}
          ALERT_RECEIVER_REPOSITORY: ${{ steps.names.outputs.alert_receiver }}
          API_DIGEST: ${{ steps.selected-api.outputs.digest }}
          API_REPOSITORY: ${{ steps.names.outputs.api }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          INITIAL_PACKAGE_STATE: ${{ steps.package-state.outputs.state }}
          MAILPIT_DIGEST: ${{ steps.selected-mailpit.outputs.digest }}
          MAILPIT_REPOSITORY: ${{ steps.names.outputs.mailpit }}
          PREFLIGHT_DIGEST: ${{ inputs.expected_preflight_digest }}
          PREFLIGHT_REPOSITORY: ${{ steps.names.outputs.preflight }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          REGISTRY_WRITE: ${{ steps.package-state.outputs.publish_remaining }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WEB_DIGEST: ${{ steps.selected-web.outputs.digest }}
          WEB_REPOSITORY: ${{ steps.names.outputs.web }}
        run: |
          set -euo pipefail

          require_digest() {
            local label="$1"
            local digest="$2"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "${label} digest is missing or invalid." >&2
              exit 1
            }
          }

          [[ "$PREFLIGHT_REPOSITORY" == "ghcr.io/modvolt/site-logbook-staging-preflight" ]]
          [[ "$MAILPIT_REPOSITORY" == "ghcr.io/modvolt/site-logbook-staging-mailpit" ]]
          [[ "$API_REPOSITORY" == "ghcr.io/modvolt/site-logbook-staging-api" ]]
          [[ "$WEB_REPOSITORY" == "ghcr.io/modvolt/site-logbook-staging-web" ]]
          [[ "$ALERT_RECEIVER_REPOSITORY" == "ghcr.io/modvolt/site-logbook-staging-alert-receiver" ]]
          require_digest preflight "$PREFLIGHT_DIGEST"
          require_digest mailpit "$MAILPIT_DIGEST"
          require_digest api "$API_DIGEST"
          require_digest web "$WEB_DIGEST"
          require_digest alert-receiver "$ALERT_RECEIVER_DIGEST"
          if [[ "$REGISTRY_WRITE" == "true" ]]; then registry_action=published; else registry_action=verified-noop; fi

          jq -n \
            --arg schemaVersion "2" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg preflight "${PREFLIGHT_REPOSITORY}@${PREFLIGHT_DIGEST}" \
            --arg mailpit "${MAILPIT_REPOSITORY}@${MAILPIT_DIGEST}" \
            --arg api "${API_REPOSITORY}@${API_DIGEST}" \
            --arg alertReceiver "${ALERT_RECEIVER_REPOSITORY}@${ALERT_RECEIVER_DIGEST}" \
            --arg callerRepository "$CALLER_REPOSITORY" \
            --arg callerWorkflowRef "$CALLER_WORKFLOW_REF" \
            --arg initialPackageState "$INITIAL_PACKAGE_STATE" \
            --arg registryAction "$registry_action" \
            --arg web "${WEB_REPOSITORY}@${WEB_DIGEST}" \
            --arg runAttempt "$RUN_ATTEMPT" \
            --arg runId "$RUN_ID" \
            --slurpfile apiPackage "${RUNNER_TEMP}/api-package.json" \
            --slurpfile alertReceiverPackage "${RUNNER_TEMP}/alert-receiver-package.json" \
            --slurpfile mailpitPackage "${RUNNER_TEMP}/mailpit-package.json" \
            --slurpfile preflightPackage "${RUNNER_TEMP}/preflight-package.json" \
            --slurpfile webPackage "${RUNNER_TEMP}/web-package.json" \
            '{schemaVersion: ($schemaVersion | tonumber), kind: "site-logbook-staging-images", publicationStage: "complete", sourceSha: $sourceSha, callerRepository: $callerRepository, callerWorkflowRef: $callerWorkflowRef, initialPackageState: $initialPackageState, registryAction: $registryAction, publisherRun: {id: $runId, attempt: $runAttempt}, toolchain: {buildx: "v0.34.1", buildkitImage: "moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f"}, images: {preflight: $preflight, mailpit: $mailpit, api: $api, web: $web, alertReceiver: $alertReceiver}, packages: {preflight: $preflightPackage[0], mailpit: $mailpitPackage[0], api: $apiPackage[0], web: $webPackage[0], alertReceiver: $alertReceiverPackage[0]}}' \
            > staging-images.json

          jq -e \
            --arg sha "$SOURCE_SHA" \
            '.schemaVersion == 2 and
             .kind == "site-logbook-staging-images" and .publicationStage == "complete" and
             .sourceSha == $sha and
             ((.initialPackageState == "10000" and .registryAction == "published") or
              (.initialPackageState == "11111" and .registryAction == "verified-noop")) and
             .toolchain == {buildx: "v0.34.1", buildkitImage: "moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f"} and
             (.images | keys) == ["alertReceiver", "api", "mailpit", "preflight", "web"] and
             (.images.preflight | test("^ghcr\\.io/modvolt/site-logbook-staging-preflight@sha256:[0-9a-f]{64}$")) and
             (.images.mailpit | test("^ghcr\\.io/modvolt/site-logbook-staging-mailpit@sha256:[0-9a-f]{64}$")) and
             (.images.api | test("^ghcr\\.io/modvolt/site-logbook-staging-api@sha256:[0-9a-f]{64}$")) and
             (.images.web | test("^ghcr\\.io/modvolt/site-logbook-staging-web@sha256:[0-9a-f]{64}$")) and
             (.images.alertReceiver | test("^ghcr\\.io/modvolt/site-logbook-staging-alert-receiver@sha256:[0-9a-f]{64}$")) and
             .packages.preflight.digest == (.images.preflight | split("@")[1]) and
             .packages.mailpit.digest == (.images.mailpit | split("@")[1]) and
             .packages.api.digest == (.images.api | split("@")[1]) and
             .packages.web.digest == (.images.web | split("@")[1]) and
             .packages.alertReceiver.digest == (.images.alertReceiver | split("@")[1]) and
             (.packages | keys) == ["alertReceiver", "api", "mailpit", "preflight", "web"] and
             (.packages | to_entries | all(.[].value;
               .visibility == "private" and .repository == "modvolt/site-logbook-registry" and
               .sourceSha == $sha and .platform == "linux/amd64" and
               .activeInventoryPaginated == true and
               (.activeVersionCount | type) == "number" and .activeVersionCount >= 1 and
               .packageVersionCount == .activeVersionCount and
               .deletedInventoryMode == "not-queryable-exact-read-scope" and
               .visibleDeletedTagConflictChecked == false and .deletedVersionCount == null and
               .deletedHistoryScope == "external-audit-ledger-only" and
               .selectedVersionRefetched == true and .remoteManifestVerified == true and
               .runtimeMetadata.source == "https://github.com/modvolt/Site-Logbook" and
               .runtimeMetadata.revision == $sha and .runtimeMetadata.buildSha == $sha and
               .provenance.buildType == "https://mobyproject.org/buildkit@v1" and
               .provenance.vcsRevision == $sha and .provenance.buildSha == $sha and
               (.provenance.vcsSource | ascii_downcase | test("^(https://github\\.com/modvolt/site-logbook(?:\\.git)?|git\\+https://github\\.com/modvolt/site-logbook(?:\\.git)?|git@github\\.com:modvolt/site-logbook\\.git)$")) and
               (.provenance.verifiedBaseImageDigests | type) == "array" and (.provenance.verifiedBaseImageDigests | length) > 0 and
               (.sbom.spdxVersion == "SPDX-2.2" or .sbom.spdxVersion == "SPDX-2.3") and
               .sbom.packageCount > 0 and .sbom.relationshipCount > 0)) and
             .packages.preflight.packageName == "site-logbook-staging-preflight" and .packages.preflight.runtimeMetadata.buildShaEnv == "BUILD_SHA" and .packages.preflight.provenance.dockerfile == "deploy/staging/preflight/Dockerfile" and .packages.preflight.provenance.buildArg == "BUILD_SHA" and
             .packages.mailpit.packageName == "site-logbook-staging-mailpit" and .packages.mailpit.runtimeMetadata.buildShaEnv == "BUILD_SHA" and .packages.mailpit.provenance.dockerfile == "deploy/staging/mailpit/Dockerfile" and .packages.mailpit.provenance.buildArg == "BUILD_SHA" and
             .packages.api.packageName == "site-logbook-staging-api" and .packages.api.runtimeMetadata.buildShaEnv == "BUILD_SHA" and .packages.api.provenance.dockerfile == "artifacts/api-server/Dockerfile" and .packages.api.provenance.buildArg == "BUILD_SHA" and
             .packages.web.packageName == "site-logbook-staging-web" and .packages.web.runtimeMetadata.buildShaEnv == "VITE_BUILD_SHA" and .packages.web.provenance.dockerfile == "artifacts/stavba/Dockerfile" and .packages.web.provenance.buildArg == "VITE_BUILD_SHA" and
             .packages.alertReceiver.packageName == "site-logbook-staging-alert-receiver" and .packages.alertReceiver.runtimeMetadata.buildShaEnv == "RECEIVER_BUILD_SHA" and .packages.alertReceiver.provenance.dockerfile == "deploy/operational-alert-receiver/Dockerfile" and .packages.alertReceiver.provenance.buildArg == "BUILD_SHA"' \
            staging-images.json >/dev/null
          sha256sum staging-images.json > staging-images.sha256
          [[ "$(awk '{print $1}' staging-images.sha256)" =~ ^[0-9a-f]{64}$ ]]

      - name: Upload immutable image manifest
        if: inputs.publication_stage == 'complete'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-images-${{ inputs.source_sha }}
          path: |
            staging-images.json
            staging-images.sha256
          if-no-files-found: error
          retention-days: 30
