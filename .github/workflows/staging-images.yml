name: Publish immutable staging images (manual, no deploy)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA selected for publication
        required: true
        type: string
      confirm_registry_publication:
        description: Publish four staging-only images to GHCR without deploying them
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-staging-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require exact source and publication confirmation
        shell: bash
        env:
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PUBLICATION_CONFIRMED: ${{ inputs.confirm_registry_publication }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "expected_sha must exactly match the selected workflow commit."
            exit 1
          fi
          if [[ "$PUBLICATION_CONFIRMED" != "true" ]]; then
            echo "Registry publication confirmation is required."
            exit 1
          fi

      - name: Check out the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase staging image names
        id: names
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          echo "preflight=ghcr.io/${owner}/site-logbook-staging-preflight" >> "$GITHUB_OUTPUT"
          echo "mailpit=ghcr.io/${owner}/site-logbook-staging-mailpit" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${owner}/site-logbook-staging-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/site-logbook-staging-web" >> "$GITHUB_OUTPUT"

      - name: Build and publish preflight image
        id: preflight
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/staging/preflight/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.preflight }}:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=staging-preflight
          cache-to: type=gha,mode=max,scope=staging-preflight
          provenance: mode=max
          sbom: true

      - name: Build and publish Mailpit image
        id: mailpit
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/staging/mailpit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.mailpit }}:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=staging-mailpit
          cache-to: type=gha,mode=max,scope=staging-mailpit
          provenance: mode=max
          sbom: true

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.api }}:${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,mode=max,scope=staging-api
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: artifacts/stavba/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          build-args: |
            BASE_PATH=/
            VITE_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web
          provenance: mode=max
          sbom: true

      - name: Create secret-free immutable image manifest
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          API_REPOSITORY: ${{ steps.names.outputs.api }}
          MAILPIT_DIGEST: ${{ steps.mailpit.outputs.digest }}
          MAILPIT_REPOSITORY: ${{ steps.names.outputs.mailpit }}
          PREFLIGHT_DIGEST: ${{ steps.preflight.outputs.digest }}
          PREFLIGHT_REPOSITORY: ${{ steps.names.outputs.preflight }}
          SOURCE_SHA: ${{ github.sha }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          WEB_REPOSITORY: ${{ steps.names.outputs.web }}
        run: |
          jq -n \
            --arg schemaVersion "1" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg preflight "${PREFLIGHT_REPOSITORY}@${PREFLIGHT_DIGEST}" \
            --arg mailpit "${MAILPIT_REPOSITORY}@${MAILPIT_DIGEST}" \
            --arg api "${API_REPOSITORY}@${API_DIGEST}" \
            --arg web "${WEB_REPOSITORY}@${WEB_DIGEST}" \
            '{schemaVersion: ($schemaVersion | tonumber), sourceSha: $sourceSha, images: {preflight: $preflight, mailpit: $mailpit, api: $api, web: $web}}' \
            > staging-images.json

      - name: Upload immutable image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-images-${{ github.sha }}
          path: staging-images.json
          if-no-files-found: error
          retention-days: 30
