name: Release candidate image smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full candidate source SHA
        type: string
        required: true
      api_image:
        description: Exact production API repository@sha256 digest
        type: string
        required: true
      web_image:
        description: Exact production web repository@sha256 digest
        type: string
        required: true
      control_plane_image:
        description: Exact control-plane digest for identity verification only
        type: string
        required: true
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      api_image:
        type: string
        required: true
      web_image:
        type: string
        required: true
      control_plane_image:
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_sha }}-${{ inputs.api_image }}-${{ inputs.web_image }}
  cancel-in-progress: false

jobs:
  exact-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_SMOKE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_SMOKE_API_IMAGE: ${{ inputs.api_image }}
      RELEASE_SMOKE_WEB_IMAGE: ${{ inputs.web_image }}
      RELEASE_SMOKE_CONTROL_PLANE_IMAGE: ${{ inputs.control_plane_image }}
    steps:
      # The candidate predates this wiring. Keep its source separate from the
      # runner/fixture belonging to the exact executing workflow revision.
      - name: Check out candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modvolt/Site-Logbook
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false

      - name: Check out smoke wiring
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modvolt/Site-Logbook
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.workflow_sha }}
          path: wiring
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate exact inputs before registry access
        working-directory: candidate
        run: node ../wiring/scripts/run-release-candidate-smoke.mjs --validate-only

      - name: Install source fixture dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Log in for exact GHCR pulls
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run disposable exact image smoke
        working-directory: candidate
        run: node ../wiring/scripts/run-release-candidate-smoke.mjs
